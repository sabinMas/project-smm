services:
  - type: web
    name: smm-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=@smm/shared && npm run build --workspace=@smm/backend
    startCommand: npm run start --workspace=@smm/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smm-db
          property: connectionString
      - key: CEREBRAS_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: llama-3.3-70b
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: smm-db
    plan: free
    region: oregon
    databaseName: smm
    user: smm
